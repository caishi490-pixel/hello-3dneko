[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-3dneko"
version = "0.1.0"
description = "AI Agent-driven stylized 3D character orchestration & closed-loop autonomous retopology workflow (Open-Source Core up to Agent Retopology)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "Pillow>=10.0.0",
    "requests>=2.31.0",
]

[project.scripts]
hello-3dneko = "run_pipeline:main"

[tool.setuptools]
py-modules = ["run_pipeline"]

[tool.setuptools.packages.find]
include = ["pipeline*"]
